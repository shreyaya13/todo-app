<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-card">
    <h1>My Tasks</h1>
    <p class="subtitle">Click a task to mark it done</p>

    <form id="todo-form" class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new task..."
        autocomplete="off"
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
