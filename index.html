<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-card">
    <h1>My Tasks</h1>
    <p class="subtitle">Click a task to mark it done</p>

    <form id="todo-form" class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new task..."
        autocomplete="off"
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
    <button type="button" id="clear-completed" class="clear-btn">Clear Completed</button>
    <table id="status-table" class="status-table">
      <thead>
        <tr>
          <th>Status</th>
          <th>Tasks</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Completed</td>
          <td id="completed-count">0</td>
        </tr>
        <tr>
          <td>Incomplete</td>
          <td id="incomplete-count">0</td>
        </tr>
        <tr>
          <td>Pending</td>
          <td id="pending-count">0</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
